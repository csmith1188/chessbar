<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #hamburger {
            width: 100px;
            height: 100px;
            position: relative;
            padding: 0;
            border: none;
            background: transparent;
            cursor: pointer;
        }

        /* common bar styles */
        #hamburger span {
            position: absolute;
            left: 12%;
            width: 76%;
            height: 10px;
            background-color: black;
            border-radius: 5px;
            transition: opacity 160ms ease;
        }

        /* initial positions */
        #hamburger .top {
            top: 22%;
            transform-origin: center;
            transition: top 260ms ease, transform 260ms ease;
        }

        #hamburger .middle {
            top: 45%;
            transition: opacity 160ms ease, transform 160ms ease;
        }

        #hamburger .bottom {
            top: 68%;
            transform-origin: center;
            transition: top 260ms ease, transform 260ms ease;
        }

        /* move to center when `on` is present; rotation is controlled by `.rotated` */
        #hamburger.on .top,
        #hamburger.on .bottom {
            top: 45%;
        }

        /* rotation applied only when `.rotated` exists (we toggle this with JS) */
        #hamburger.rotated .top {
            transform: rotate(45deg);
        }

        #hamburger.rotated .bottom {
            transform: rotate(-45deg);
        }

        #hamburger.on .middle {
            opacity: 0;
            transform: scaleX(0);
        }
    </style>
</head>
<body>
    <button id="hamburger">
        <span class="top"></span>
        <span class="middle"></span>
        <span class="bottom"></span>
    </button>
</body>

<script>
    const hamburger = document.getElementById('hamburger')
    let seqTimeout = null
    const ROT_DELAY = 260 // ms

    hamburger.addEventListener('click', () => {
        // If turning ON: move to center (add `on`), then add `rotated` after delay
        if (!hamburger.classList.contains('on')) {
            clearTimeout(seqTimeout)
            hamburger.classList.add('on')
            hamburger.classList.remove('rotated')
            seqTimeout = setTimeout(() => hamburger.classList.add('rotated'), ROT_DELAY)
            return
        }

        // If turning OFF: remove rotation immediately, then remove `on` after rotation finishes
        clearTimeout(seqTimeout)
        hamburger.classList.remove('rotated')
        seqTimeout = setTimeout(() => hamburger.classList.remove('on'), ROT_DELAY)
    })
</script>
</html>
